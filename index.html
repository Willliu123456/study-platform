  <script src="./js/data.js"></script>

  <script src="./js/lib/pdf.min.js"></script>
  <script src="./js/importer.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/app.js"></script>

  <!-- 安装应用引导条 -->
  <div id="install-bar" hidden>
    <span>把「学升」装到桌面，像 App 一样使用</span>
    <button id="install-btn">安装应用</button>
    <button id="install-close" aria-label="关闭">✕</button>
  </div>
  <style>
    #install-bar {
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      color: #1f2937;
      padding: 10px 14px 10px 16px;
      border-radius: 12px;
      box-shadow: 0 8px 28px rgba(31, 41, 55, .22);
      font-size: 13px;
      z-index: 9999;
    }
    #install-bar[hidden] { display: none; }
    #install-btn {
      background: #3043AA;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    #install-btn:hover { background: #16309A; }
    #install-close {
      background: none;
      border: none;
      color: #9ca3af;
      font-size: 14px;
      cursor: pointer;
      padding: 4px;
    }
    #install-close:hover { color: #4b5563; }
  </style>
  <script>
    (function () {
      var promptEvt = null;
      var bar = document.getElementById('install-bar');
      var btn = document.getElementById('install-btn');
      var close = document.getElementById('install-close');

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        promptEvt = e;
        bar.hidden = false;
      });
      if (close) close.addEventListener('click', function () { bar.hidden = true; });
      if (btn) btn.addEventListener('click', function () {
        if (!promptEvt) return;
        promptEvt.prompt();
        promptEvt.userChoice.then(function () { bar.hidden = true; });
      });
      window.addEventListener('appinstalled', function () { bar.hidden = true; });

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(function () {});
      }
    })();
  </script>
