# 学升 · nginx 反向代理示例
# 作用：把 80/443 端口转发到 Node 后端(8790)，并启用 HTTPS
# 用法：替换 server_name 后放入 /etc/nginx/sites-available/，软链到 sites-enabled

server {
    listen 80;
    server_name xs.example.com;   # ← 改成你的域名（或用 IP）

    # 允许上传较大的 .doc / .docx 题库文件
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}

# ---- HTTPS（免费证书）----
# sudo apt install certbot python3-certbot-nginx
# sudo certbot --nginx -d xs.example.com
# 证书签发后，前端在"云端服务器"里应填 https://xs.example.com
